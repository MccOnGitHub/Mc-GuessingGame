<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc's Guess the Word for a Prize! 🗣️🔥</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 400px;
        }

        input[type="text"], input[type="email"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #email-section, #decryption-section {
            display: none;
        }

        .message {
            color: #e67e22;
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
    <!-- CryptoJS for AES Encryption/Decryption -->
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("14bDvyDywACODtaux"); // Your EmailJS User/Public Key
        })();
    </script>
</head>
<body>
    <div class="container">
        <h1>Mc's Guess the Word for a Prize! 🗣️🔥</h1>
        <p>Oh ano g kaba? libre na to oh! enter the correct word to release the prize lolol:</p>
        <p><strong>Current Prize: COD POINTS (CP)</strong></p>
        
        <input type="text" id="guess" placeholder="Enter your guess here">
        <button onclick="checkGuess()">Submit</button>
        
        <div id="decryption-section">
            <p class="message">Request the decryption code from the owner to proceed!</p>
            <input type="text" id="decryption-code" placeholder="Enter decryption code">
            <button onclick="verifyDecryptionCode()">Submit Code</button>
        </div>
        
        <div id="email-section">
            <h3>Congrats! Enter your email to receive the redeem code:</h3>
            <input type="email" id="email" placeholder="Enter your email">
            <button onclick="sendEmail()">Send Code</button>
        </div>
    </div>

    <script>
        // Secret word and encrypted code
        const secretWord = "pneumonoultramicroscopicsilicovolcanoconiosis"; 
        const encryptedCode = "U2FsdGVkX19d2QzS9D1WJ1kJ0v4H7sM5DGFuZ94+yUE="; 
        const ownerDecryptionKey = "hitler"; // The private key only you know

        // AES Decryption function
        function decrypt(text, key) {
            const bytes = CryptoJS.AES.decrypt(text, key);
            return bytes.toString(CryptoJS.enc.Utf8);
        }

        // Check the guess for the secret word
        function checkGuess() {
            const userGuess = document.getElementById("guess").value.trim().toLowerCase();
            if (userGuess === secretWord.toLowerCase()) {
                alert("Correct! Request the decryption code from the owner.");
                document.getElementById("decryption-section").style.display = "block";
            } else {
                alert("Wrong guess! Try again.");
            }
        }

        // Verify the decryption code
        function verifyDecryptionCode() {
            const userCode = document.getElementById("decryption-code").value.trim();
            if (userCode === ownerDecryptionKey) {
                alert("Decryption code verified! Proceed to enter your email.");
                document.getElementById("decryption-section").style.display = "none";
                document.getElementById("email-section").style.display = "block";
            } else {
                alert("Incorrect decryption code! Generating warning file...");
                generateWarningFile();
            }
        }

        // Generate and download warning file
        function generateWarningFile() {
            const warningMessage = "Your device will self-destruct in 5 seconds.";
            const blob = new Blob([warningMessage], { type: 'text/plain' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "warning.txt";
            link.click();
        }

        // Send email using EmailJS
        function sendEmail() {
            const email = document.getElementById("email").value;
            if (!email) {
                alert("Please enter your email.");
                return;
            }

            // Decrypt the code using the secret key
            const decryptedCode = decrypt(encryptedCode, ownerDecryptionKey);

            const templateParams = {
                to_email: email,
                code: decryptedCode
            };

            emailjs.send("service_vqvhy6k", "template_yf53c3w", templateParams)
            .then(function(response) {
                alert("Redeem code sent to your email!");
            }, function(error) {
                alert("Failed to send email. Please try again.");
                console.log('EmailJS Error:', error);
            });
        }
    </script>
</body>
</html>
