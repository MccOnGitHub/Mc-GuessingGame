<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc's Guess the Word for a Prize! 🗣️🔥</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="text"], input[type="email"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #email-section {
            display: none;
        }
    </style>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("14bDvyDywACODtaux"); // Your EmailJS User/Public Key
        })();
    </script>
</head>
<body>
    <div class="container">
        <h1>Mc's Guess the Word for a Prize! 🗣️🔥</h1>
        <p>Oh ano g kaba? libre na to oh! enter the correct word to release the prize lolol:</p>
        <p><strong>Current Prize: COD POINTS (CP)</strong></p>
        
        <input type="text" id="guess" placeholder="Enter your guess here">
        <button onclick="checkGuess()">Submit</button>
        
        <div id="email-section">
            <h3>Congrats! Enter your email to receive the redeem code:</h3>
            <input type="email" id="email" placeholder="Enter your email">
            <button onclick="sendEmail()">Send Code</button>
        </div>
    </div>

    <script>
        // Secret word and redeem code
        const secretWord = "pneumonoultramicroscopicsilicovolcanoconiosis"; // Longest word in the dictionary
        const redeemCode = "6364343370575049"; // Prize Code

        // Check the guess
        function checkGuess() {
            const userGuess = document.getElementById("guess").value.trim().toLowerCase();
            if (userGuess === secretWord.toLowerCase()) {
                alert("Correct! Enter your email to receive the redeem code.");
                document.getElementById("email-section").style.display = "block";
            } else {
                alert("Wrong guess! Try again.");
            }
        }

        // Send email using EmailJS
        function sendEmail() {
            const email = document.getElementById("email").value;
            if (!email) {
                alert("Please enter your email.");
                return;
            }

            const templateParams = {
                to_email: email,
                code: redeemCode
            };

            emailjs.send("service_vqvhy6k", "template_yf53c3w", templateParams)
            .then(function(response) {
                alert("Redeem code sent to your email!");
            }, function(error) {
                alert("Failed to send email. Please try again.");
                console.log('EmailJS Error:', error);
            });
        }
    </script>
</body>
</html>
