<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc's Guess the Word for a Prize! 🗣️🔥</title>
    <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="text"], input[type="email"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #prize, #email-section {
            display: none;
            margin-top: 20px;
        }

        .subtext {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .prize-info {
            font-size: 18px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }

        #link {
            display: none;
            margin-top: 15px;
        }

        #link a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        #link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mc's Guess the Word for a Prize! 🗣️🔥</h1>
        <p class="subtext">Oh ano g kaba? libre na to oh! enter the correct word to release the prize lolol:</p>
        <p class="prize-info">Current Prize: COD POINTS (CP)</p>
        <input type="text" id="guess" placeholder="Enter your guess here">
        <button onclick="checkGuess()">Submit</button>
        
        <div id="email-section">
            <input type="email" id="email" placeholder="Enter your email to receive the prize">
            <button onclick="sendPrize()">Send Prize</button>
        </div>

        <p id="prize"></p>
        <p id="link">Redeem your prize <a href="https://shop.garena.ph/" target="_blank">here</a>.</p>
    </div>

    <script>
        // Initialize EmailJS with your Public Key
        emailjs.init("kDNFc7O25a_8wOvGv");

        const encryptedCode = "d1hCdlJ5SUxDQW1QZktEVA=="; // Double-encrypted redeem code
        const secretWord = "hitler"; // Decryption key

        function checkGuess() {
            const userGuess = document.getElementById("guess").value.trim().toLowerCase();
            
            if (userGuess === "pneumonoultramicroscopicsilicovolcanoconiosis") {
                document.getElementById("email-section").style.display = "block";
                document.getElementById("prize").innerHTML = `Correct! Enter your email to receive the prize.`;
                document.getElementById("prize").style.display = "block";
            } else {
                alert("Wrong guess! Try again.");
            }
        }

        function sendPrize() {
            const email = document.getElementById("email").value;
            
            if (!email) {
                alert("Please enter your email.");
                return;
            }

            // Decrypt the code using the secret word
            const decodedCode = atob(encryptedCode);
            let redeemCode = '';
            for (let i = 0; i < decodedCode.length; i++) {
                redeemCode += String.fromCharCode(decodedCode.charCodeAt(i) ^ secretWord.charCodeAt(i % secretWord.length));
            }

            // Setup the template parameters
            const templateParams = {
                to_email: email,
                code: redeemCode
            };

            // Send the email using EmailJS
            emailjs.send("service_vqvhy6k", "template_yf53c3w", templateParams)
            .then(function(response) {
                alert("Prize sent to your email!");
                console.log("SUCCESS:", response);
            }, function(error) {
                console.error('EmailJS Error:', error);
                alert("Failed to send email. Check console for details.");
            });
        }
    </script>
</body>
</html>
