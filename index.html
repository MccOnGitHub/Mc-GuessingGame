<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc's Guess the Word for a Prize! 🗣️🔥</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #prize {
            display: none;
            margin-top: 20px;
            color: #2c3e50;
            font-weight: bold;
        }

        .subtext {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .prize-info {
            font-size: 18px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }

        #link {
            display: none;
            margin-top: 15px;
        }

        #link a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        #link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mc's Guess the Word for a Prize!🙏🏻🗣️🔥</h1>
        <p class="subtext">Oh ano g kaba? libre na to oh! enter the correct word to release the prize lolol:</p>
        <p class="prize-info">Current Prize: COD POINTS (CP)</p>
        <input type="text" id="guess" placeholder="Enter your guess here">
        <button onclick="checkGuess()">Submit</button>
        <p id="prize"></p>
        <p id="link">Redeem your prize <a href="https://shop.garena.ph/" target="_blank">here</a>.</p>
    </div>

    <script>
        const randomChar = "absolute value inequality"; // Hidden secret phrase
        const encodedCode = "NjM2NDM0MzM3MDU3NTA0OQ=="; // Base64 encoded redeem code

        function checkGuess() {
            const userGuess = document.getElementById("guess").value.trim().toLowerCase();
            
            if (userGuess === randomChar.toLowerCase()) {
                const redeemCode = atob(encodedCode); // Decode the code
                document.getElementById("prize").innerHTML = `Congratulations! Nays one! eto redeem code mo: <strong>${redeemCode}</strong>`;
                document.getElementById("prize").style.display = "block";
                document.getElementById("link").style.display = "block";
            } else {
                alert("Wrong guess! Try again.");
            }
        }
    </script>
</body>
</html>
