<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc's Guess the Word for a Prize! 🗣️🔥</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #prize {
            display: none;
            margin-top: 20px;
            color: #2c3e50;
            font-weight: bold;
        }

        .subtext {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .prize-info {
            font-size: 18px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }

        #link {
            display: none;
            margin-top: 15px;
        }

        #link a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        #link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mc's Guess the Word for a Prize! 🗣️🔥</h1>
        <p class="subtext">Oh ano g kaba? libre na to oh! enter the correct word to release the prize lolol:</p>
        <p class="prize-info">Current Prize: COD POINTS (CP)</p>
        <input type="text" id="guess" placeholder="Enter your guess here">
        <button onclick="checkGuess()">Submit</button>
        <p id="prize"></p>
    </div>

    <script>
        const randomChar = "pneumonoultramicroscopicsilicovolcanoconiosis"; // Secret word
        const encryptedCode = "d1hCdlJ5SUxDQW1QZktEVA=="; // Double-encrypted redeem code
        const secretWord = "hitler"; // Decryption key

        // Check if the user already won before
        window.onload = function() {
            const storedCode = localStorage.getItem("redeemCode");
            if (storedCode) {
                displayPrize(storedCode);
            }
        };

        function checkGuess() {
            const userGuess = document.getElementById("guess").value.trim().toLowerCase();
            
            if (userGuess === randomChar.toLowerCase()) {
                const decodedCode = atob(encryptedCode);
                let redeemCode = '';
                for (let i = 0; i < decodedCode.length; i++) {
                    redeemCode += String.fromCharCode(decodedCode.charCodeAt(i) ^ secretWord.charCodeAt(i % secretWord.length));
                }
                
                // Store the code in localStorage to show after redirection
                localStorage.setItem("redeemCode", redeemCode);

                // Redirect based on device type
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                if (isMobile) {
                    window.location.href = "vnd.youtube://youtu.be/xvFZjo5PgG0?si=iy-ZMfIWZRrrLZhE";
                } else {
                    window.location.href = "https://youtu.be/xvFZjo5PgG0?si=iy-ZMfIWZRrrLZhE";
                }
            } else {
                alert("Wrong guess! Try again.");
            }
        }

        function displayPrize(redeemCode) {
            document.getElementById("prize").innerHTML = `Congratulations! Here is your redeem code: <strong>${redeemCode}</strong>`;
            document.getElementById("prize").style.display = "block";
        }
    </script>
</body>
</html>
