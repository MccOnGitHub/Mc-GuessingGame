<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc's Guess the Word for a Prize! 🗣️🔥</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #prize {
            display: none;
            margin-top: 20px;
            color: #2c3e50;
            font-weight: bold;
        }

        .subtext {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .prize-info {
            font-size: 18px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mc's Guess the Word for a Prize! 🗣️🔥</h1>
        <p class="subtext">Oh ano g kaba? libre na to oh! enter the correct word to release the prize lolol:</p>
        <p class="prize-info">Current Prize: COD POINTS (CP)</p>
        <input type="text" id="guess" placeholder="Enter your guess here">
        <button onclick="checkGuess()">Submit</button>
        <p id="prize"></p>
    </div>

    <script>
        const shiftValue = 7;
        const xorKeys = [42, 91, 63];
        const encryptedRandomChar = "QlpoOTFBWSZTWaS7hJ4AABXfgAAQIdgAECohVIAA3EAAAAhD0oPVT9QPU9A0AABBpoNA0aQAAADQ09QA9DQAGjUNBoA0aNA09QA";
        const encryptedCode = [119, 72, 111, 50, 117, 109, 67, 86, 84, 87, 51, 85, 97, 116];

        function base64Decode(str) {
            return decodeURIComponent(atob(str).split('').map(c =>
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join(''));
        }

        function tripleXORDecrypt(arr, keys) {
            return arr.map((char) => {
                let result = char;
                keys.forEach(key => {
                    result ^= key;
                });
                return String.fromCharCode(result);
            }).join('');
        }

        function complexDecrypt(encStr, key) {
            let decoded = base64Decode(encStr);
            let decrypted = "";

            for (let i = 0; i < decoded.length; i++) {
                let charCode = decoded.charCodeAt(i);
                charCode -= shiftValue;
                charCode ^= key.charCodeAt(i % key.length);
                decrypted += String.fromCharCode(charCode);
            }
            return decrypted;
        }

        function showSelfDestruct() {
            if (localStorage.getItem('selfDestructed')) return;
            
            let countdown = 5;
            const countdownInterval = setInterval(() => {
                alert(`Your device will self-destruct in ${countdown}...`);
                countdown--;
                if (countdown === 0) {
                    clearInterval(countdownInterval);
                    alert("Just kidding! But nice try. 😜");
                    localStorage.setItem('selfDestructed', true);

                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                    const redirectUrl = "https://youtu.be/xvFZjo5PgG0?si=iy-ZMfIWZRrrLZhE";
                    window.location.href = isMobile ? redirectUrl : redirectUrl;
                }
            }, 1000);
        }

        function checkGuess() {
            const userGuess = document.getElementById("guess").value.trim().toLowerCase();
            const userKey = prompt("Request decryption code from the owner:");

            try {
                const decryptedRandomChar = complexDecrypt(encryptedRandomChar, userKey);

                if (userGuess === decryptedRandomChar.toLowerCase()) {
                    const redeemCode = tripleXORDecrypt(encryptedCode, xorKeys);
                    localStorage.setItem('redeemCode', redeemCode);
                    document.getElementById("prize").innerHTML = `Congratulations! Here is your redeem code: <strong>${redeemCode}</strong>`;
                    document.getElementById("prize").style.display = "block";
                } else {
                    alert("Wrong guess! Try again.");
                }
            } catch (e) {
                showSelfDestruct();
            }
        }

        window.onload = function() {
            const savedCode = localStorage.getItem('redeemCode');
            if (savedCode) {
                document.getElementById("prize").innerHTML = `Welcome back! Your redeem code is: <strong>${savedCode}</strong>`;
                document.getElementById("prize").style.display = "block";
            }
        }
    </script>
</body>
</html>
